name: Renovate
description: Propose dependency updates for this repository using the Renovate CLI.
inputs:
  token:
    description: GitHub token with access to this repository and permission to create dependency update PRs.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Run Renovate
      shell: bash
      env:
        RENOVATE_TOKEN: ${{ inputs.token }}
        RENOVATE_PLATFORM: github
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        RENOVATE_ONBOARDING: 'false'
        RENOVATE_REQUIRE_CONFIG: required
        RENOVATE_BINARY_SOURCE: global
      run: |
        if [ -z "$RENOVATE_TOKEN" ]; then
          echo '::error::Add the RENOVATE_TOKEN repository secret before running Renovate.'
          exit 1
        fi
        npx --yes --package=renovate@44.198.3 -- renovate
