name: Build, test and pack
description: Validate formatting, build, test and consume the IdentityServer packages on Windows or Linux.
inputs:
  version:
    description: Optional release version taken from the Git tag; otherwise use Directory.Build.props.
    required: false
  artifact-name:
    description: Name of the uploaded packages and test results; unique per job of a run.
    required: false
    default: packages-and-test-results
runs:
  using: composite
  steps:
    - name: Resolve package version
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        $version = $env:RELEASE_VERSION
        if (!$version) {
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = $properties.Project.PropertyGroup.Version
        }
        $number = '(?:0|[1-9][0-9]*)'
        $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        $pattern = "^${number}\.${number}\.${number}(?:-${identifier}(?:\.${identifier})*)?$"
        if ($version -notmatch $pattern) { throw 'Use a SemVer tag such as 0.1.0 or 0.1.0-alpha.1, without v or build metadata.' }
        $changelog = Get-Content CHANGELOG.md -Raw
        $heading = "(?m)^## $([regex]::Escape($version)) - "
        if ($env:RELEASE_VERSION) {
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $version -ne $env:GITHUB_REF_NAME) { throw 'The release version must match the Git tag.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
          if ($changelog -notmatch "$heading\d{4}-\d{2}-\d{2}\s*$") { throw "Date the CHANGELOG entry '## $version - YYYY-MM-DD' before tagging." }
        } else {
          if ($changelog -notmatch $heading) { throw "Add a CHANGELOG entry for $version." }
          # Branch artifacts must never carry a version already published on nuget.org.
          try {
            $index = Invoke-RestMethod -Uri 'https://api.nuget.org/v3-flatcontainer/thedotside.aspire.identityserver.hosting/index.json' -SkipHttpErrorCheck -StatusCodeVariable status
          } catch {
            Write-Warning "Could not check published versions on nuget.org: $($_.Exception.Message)"
            $status = 0
          }
          if ($status -eq 200 -and $index.versions -contains $version.ToLowerInvariant()) { throw "$version is already published: bump Version in Directory.Build.props." }
        }
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "PACKAGE_VERSION=$version"
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Prepare HTTPS
      shell: pwsh
      run: |
        # Trust only this runner's public development certificate, without a desktop prompt.
        $ciCertificatePath = Join-Path $env:RUNNER_TEMP 'aspire-https.crt'
        dotnet dev-certs https --export-path $ciCertificatePath --format PEM
        if ($LASTEXITCODE -ne 0) { throw 'Could not create the HTTPS development certificate.' }
        if ($IsWindows) {
          Import-Certificate -FilePath $ciCertificatePath -CertStoreLocation 'Cert:\LocalMachine\Root' -Confirm:$false -ErrorAction Stop | Out-Null
          dotnet dev-certs https --check --trust
          if ($LASTEXITCODE -ne 0) { throw 'The HTTPS development certificate is not trusted.' }
        } else {
          # .NET uses the OpenSSL system store; Chromium reads the user's NSS database.
          sudo cp $ciCertificatePath /usr/local/share/ca-certificates/aspire-https.crt
          sudo update-ca-certificates
          if ($LASTEXITCODE -ne 0) { throw 'Could not trust the HTTPS development certificate.' }
          if (!(Get-Command certutil -ErrorAction SilentlyContinue)) { sudo apt-get install -y libnss3-tools }
          $nss = Join-Path $HOME '.pki/nssdb'
          if (!(Test-Path $nss)) { New-Item -ItemType Directory -Path $nss | Out-Null; certutil -d "sql:$nss" -N --empty-password }
          # A self-signed server certificate is a trusted peer (P), not a certificate authority (C).
          certutil -d "sql:$nss" -A -t 'P,,' -n aspire-https -i $ciCertificatePath
          if ($LASTEXITCODE -ne 0) { throw 'Could not trust the HTTPS development certificate for Chromium.' }
        }
    - name: Restore
      shell: pwsh
      run: dotnet restore --locked-mode
    - name: Restore local tools
      shell: pwsh
      run: dotnet tool restore
    - name: Check formatting
      shell: pwsh
      run: dotnet csharpier check .
    - name: Check documented versions
      shell: pwsh
      run: pwsh eng/check-docs.ps1
    - name: Build
      shell: pwsh
      run: dotnet build --no-restore "/p:Version=$env:PACKAGE_VERSION"
    - name: Resolve the Playwright version
      id: playwright
      shell: pwsh
      run: |
        [xml]$packages = Get-Content Directory.Packages.props -Raw
        $version = ($packages.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'Microsoft.Playwright').Version
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/AppData/Local/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install browser
      shell: pwsh
      run: |
        # The tests run headless: the shell build is enough, with its system dependencies on Linux.
        $arguments = @('install', '--only-shell', 'chromium')
        if ($IsLinux) { $arguments = @('install', '--with-deps', '--only-shell', 'chromium') }
        pwsh tests/Aspire.IdentityServer.DistributedTests/bin/Debug/net10.0/playwright.ps1 @arguments
        if ($LASTEXITCODE -ne 0) { throw 'Could not install Chromium.' }
    - name: Test
      shell: pwsh
      run: dotnet test --no-build --report-trx --results-directory artifacts/test-results --hangdump --hangdump-timeout 5m
    - name: Pack
      shell: pwsh
      run: pwsh eng/pack.ps1 -Version $env:PACKAGE_VERSION
    - name: Verify packages in independent consumers
      shell: pwsh
      run: pwsh eng/package-smoke.ps1 -Version $env:PACKAGE_VERSION
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          artifacts/packages/*
          artifacts/test-results/
