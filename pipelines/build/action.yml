name: Build, test and pack
description: Validate formatting, build, test and consume the IdentityServer packages on Windows.
inputs:
  version:
    description: Optional release version taken from the Git tag; otherwise use Directory.Build.props.
    required: false
runs:
  using: composite
  steps:
    - name: Resolve package version
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        $version = $env:RELEASE_VERSION
        if (!$version) {
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = $properties.Project.PropertyGroup.Version
        }
        $number = '(?:0|[1-9][0-9]*)'
        $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        $pattern = "^${number}\.${number}\.${number}(?:-${identifier}(?:\.${identifier})*)?$"
        if ($version -notmatch $pattern) { throw 'Use a SemVer tag such as 0.1.0 or 0.1.0-alpha.1, without v or build metadata.' }
        if ($env:RELEASE_VERSION) {
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $version -ne $env:GITHUB_REF_NAME) { throw 'The release version must match the Git tag.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
        }
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "PACKAGE_VERSION=$version"
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Prepare HTTPS
      shell: pwsh
      run: |
        # Trust only this runner's public development certificate without a desktop prompt.
        $ciCertificatePath = Join-Path $env:RUNNER_TEMP 'aspire-https.crt'
        dotnet dev-certs https --export-path $ciCertificatePath --format PEM
        if ($LASTEXITCODE -ne 0) { throw 'Could not create the HTTPS development certificate.' }
        Import-Certificate -FilePath $ciCertificatePath -CertStoreLocation 'Cert:\LocalMachine\Root' -Confirm:$false -ErrorAction Stop | Out-Null
        dotnet dev-certs https --check --trust
        if ($LASTEXITCODE -ne 0) { throw 'The HTTPS development certificate is not trusted.' }
    - name: Restore
      shell: pwsh
      run: dotnet restore
    - name: Restore local tools
      shell: pwsh
      run: dotnet tool restore
    - name: Check formatting
      shell: pwsh
      run: dotnet csharpier check .
    - name: Build
      shell: pwsh
      run: dotnet build --no-restore "/p:Version=$env:PACKAGE_VERSION"
    - name: Install browser
      shell: pwsh
      run: pwsh tests/Aspire.IdentityServer.DistributedTests/bin/Debug/net10.0/playwright.ps1 install chromium
    - name: Test
      shell: pwsh
      run: dotnet test --no-build --report-trx --results-directory artifacts/test-results --hangdump --hangdump-timeout 5m
    - name: Pack
      shell: pwsh
      run: pwsh eng/pack.ps1 -Version $env:PACKAGE_VERSION
    - name: Verify packages in independent consumer
      shell: pwsh
      run: pwsh eng/package-smoke.ps1 -Version $env:PACKAGE_VERSION
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: packages-and-test-results
        path: |
          artifacts/packages/*
          artifacts/test-results/
