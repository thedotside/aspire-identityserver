name: build-test-pack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare HTTPS
        run: dotnet dev-certs https --trust
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Install browser
        run: pwsh tests/Aspire.IdentityServer.Tests/bin/Debug/net10.0/playwright.ps1 install chromium
      - name: Test
        run: dotnet test --no-build --logger trx --results-directory artifacts/test-results
      - name: Pack
        run: pwsh eng/pack.ps1
      - name: Verify packages in independent consumer
        run: pwsh eng/package-smoke.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packages-and-test-results
          path: |
            artifacts/packages/*
            artifacts/test-results/*
