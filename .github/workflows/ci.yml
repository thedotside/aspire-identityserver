name: build-test-pack
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # macOS is not in the matrix: its minutes count ten times on a private repository.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # GitHub requires the trigger here; the build pipeline lives in /pipelines.
      - name: Build, test and pack
        uses: ./pipelines/build
        with:
          artifact-name: packages-and-test-results-${{ matrix.os }}
