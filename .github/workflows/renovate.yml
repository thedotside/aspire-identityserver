name: Renovate
on:
  schedule:
    - cron: '17 5 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - renovate.json
      - pipelines/renovate/**
      - .github/workflows/renovate.yml
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Update dependencies
        uses: ./pipelines/renovate
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
