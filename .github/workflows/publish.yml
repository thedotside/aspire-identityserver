name: publish-nuget
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: publish-nuget
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, test and pack the tagged version
        uses: ./pipelines/build
        with:
          version: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    # Required reviewers and the tag rule are set on this environment in the repository
    # settings; NuGet's trusted publishing policy can then require it too.
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the verified packages to NuGet
        uses: ./pipelines/publish
        with:
          version: ${{ github.ref_name }}
          user: ${{ vars.NUGET_USER }}
